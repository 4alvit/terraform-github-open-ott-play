name: Local validation
'on':
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    name: Repository validation
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned syntax parser
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Install checksum-verified actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location   https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install verified TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
          checksums: |
            cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
            560da89aacf59389d4eb029730dd5b109b7288096c32f2726a0d9e783a5ea8eb
      - name: Verify isolated secure-provider builder
        run: |
          python3 -m venv "$RUNNER_TEMP/secure-provider-tests"
          "$RUNNER_TEMP/secure-provider-tests/bin/pip" install --require-hashes -r requirements-security-tests.txt
          "$RUNNER_TEMP/secure-provider-tests/bin/python" -m unittest discover -s tests -p 'test_secure*.py'
      - name: Run local checks
        run: bash scripts/ci.sh
      - name: Verify real Terraform and provider TLS boundaries
        env:
          TLS_TEST_PLATFORM: linux_amd64
        run: |
          python3 -m venv "$RUNNER_TEMP/tls-test-venv"
          "$RUNNER_TEMP/tls-test-venv/bin/pip" install cryptography==50.0.2 cffi==2.1.1 pycparser==3.0
          mirror="$RUNNER_TEMP/tls-provider-mirror"
          mirror_config="$RUNNER_TEMP/tls-mirror-config"
          mkdir -p "$mirror_config"
          cat > "$mirror_config/main.tf" <<'EOF'
          terraform {
            required_providers {
              github = {
                source  = "integrations/github"
                version = "6.13.0"
              }
            }
          }
          EOF
          terraform -chdir="$mirror_config" providers mirror -platform=linux_amd64 "$mirror"
          provider_dir="$RUNNER_TEMP/tls-provider"
          mkdir -p "$provider_dir"
          unzip "$mirror/registry.terraform.io/integrations/github/terraform-provider-github_6.13.0_linux_amd64.zip" -d "$provider_dir"
          TLS_TEST_TERRAFORM="$(command -v terraform)"
          export TLS_TEST_TERRAFORM
          export TLS_TEST_PROVIDER_DIR="$provider_dir"
          go version -m "$TLS_TEST_TERRAFORM"
          go version -m "$provider_dir/terraform-provider-github_v6.13.0"
          "$RUNNER_TEMP/tls-test-venv/bin/python" scripts/test_tls_profile.py
      - name: Validate the FLOSS OpenTofu compatibility profile
        run: |
          tofu_dir="$RUNNER_TEMP/opentofu-1.13.1"
          mkdir -p "$tofu_dir"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip -o "$tofu_dir/tofu.zip"
          printf '%s  %s\n' '8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80' "$tofu_dir/tofu.zip" | sha256sum --check --strict
          unzip "$tofu_dir/tofu.zip" -d "$tofu_dir"
          TOFU_BIN="$tofu_dir/tofu" python3 scripts/check_opentofu.py
          TLS_TEST_TERRAFORM="$tofu_dir/tofu" TLS_TEST_PROVIDER_DIR="$RUNNER_TEMP/tls-provider" TLS_TEST_PLATFORM=linux_amd64 "$RUNNER_TEMP/tls-test-venv/bin/python" scripts/test_tls_profile.py
